<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subs | Luca F. Chala</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script>
        // Restaura o tema antes do first paint para evitar flash
        if (localStorage.getItem('theme') === 'light') document.documentElement.setAttribute('data-theme', 'light');
    </script>
    
    <!-- Grain overlay do ecossistema -->
    <svg class="grain" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter>
        <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
    </svg>

    <div class="controls">
        <div class="controls-inner">
            <button class="ctrl-btn" id="lang-toggle">EN</button>
            <button class="ctrl-btn" id="theme-toggle">◐</button>
        </div>
    </div>

    <main>
        <header>
            <h1 class="name">subs</h1>
            <p class="bio" style="margin-top: -10px; color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 0.9em;">
                Subscription Matrix · USD/BRL: <span id="exchange-rate">Carregando...</span>
            </p>
        </header>

        <!-- Dashboard Numérico -->
        <section class="dashboard">
            <div class="dash-card">
                <span class="label">Total Mensal (BRL)</span>
                <div class="value" id="total-monthly">R$ 0,00</div>
            </div>
            <div class="dash-card">
                <span class="label">Projeção Anual (BRL)</span>
                <div class="value" id="total-yearly">R$ 0,00</div>
            </div>
        </section>

        <div class="rule">FULL PICTURE (CALENDAR)</div>
        <section class="calendar">
            <!-- Grid gerado via JS -->
            <div class="cal-grid" id="calendar-grid"></div>
        </section>

        <div class="rule">ADD SUBSCRIPTION</div>
        <section class="form-section">
            <form id="sub-form">
                <div class="input-row">
                    <input type="text" id="sub-name" placeholder="Nome (ex: AWS, Netflix)" required>
                    <input type="text" id="sub-domain" placeholder="Domínio p/ Logo (ex: aws.amazon.com)">
                </div>
                <div class="input-row">
                    <input type="number" id="sub-price" placeholder="Valor" step="0.01" required>
                    <select id="sub-currency">
                        <option value="BRL">BRL (R$)</option>
                        <option value="USD">USD ($)</option>
                    </select>
                    <select id="sub-cycle">
                        <option value="monthly">Mensal</option>
                        <option value="yearly">Anual</option>
                        <option value="weekly">Semanal</option>
                    </select>
                    <input type="number" id="sub-day" placeholder="Dia Venc. (1-31)" min="1" max="31" required>
                </div>
                <div class="input-row">
                    <input type="text" id="sub-tags" placeholder="Tags (separadas por vírgula, ex: homelab, personal)">
                    <button type="submit" class="act-btn">Adicionar</button>
                </div>
            </form>
        </section>

        <div class="rule">ACTIVE SUBSCRIPTIONS</div>
        <section class="actions-bar">
            <button class="act-btn" id="btn-export-json">↓ Export JSON</button>
            <label class="act-btn" style="cursor:pointer;">
                ↑ Import JSON
                <input type="file" id="btn-import-json" accept=".json" style="display:none;">
            </label>
            <button class="act-btn" id="btn-export-ics">📅 Export Webcal (.ics)</button>
        </section>
        
        <div id="subs-list">
            <!-- Cards injetados via JS -->
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
