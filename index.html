<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>subs — Luca F. Chala</title>
    <meta name="description" content="Controle pessoal de assinaturas: custos mensais e anuais em BRL, calendário de renovações e exportação .ics.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0d0c0a">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/style.css">
    <script data-cfasync="false" src="/theme.js"></script>
    <script data-cfasync="false" src="/core.js" defer></script>
    <script data-cfasync="false" src="/app.js" defer></script>
</head>
<body>
    <a class="skip" href="#main" data-i18n="skip">Pular para o conteúdo</a>

    <div class="controls">
        <div class="controls-inner" role="group" data-i18n-attr="aria-label:prefs" aria-label="Preferências">
            <button class="ctrl-btn" type="button" data-lang-btn="pt" aria-pressed="true">PT</button>
            <span class="ctrl-sep" aria-hidden="true">|</span>
            <button class="ctrl-btn" type="button" data-lang-btn="en" aria-pressed="false">EN</button>
            <span class="ctrl-sep" aria-hidden="true">·</span>
            <button class="ctrl-btn theme" type="button" id="btn-theme" data-i18n-attr="aria-label:theme" aria-label="Alternar tema">◐</button>
        </div>
    </div>

    <header>
        <h1 class="name">subs</h1>
        <p class="micro" data-i18n="tagline">assinaturas · custos recorrentes</p>
        <p class="rates" id="rates" aria-live="polite"></p>
    </header>

    <main id="main">
        <p class="banner" id="backup-banner" hidden><span data-i18n="backup_nag">Os dados ficam só neste navegador — exporte um backup de vez em quando.</span> <button class="link-btn" type="button" data-action="export-json" data-i18n="export_now">exportar agora</button></p>

        <section class="dashboard" aria-labelledby="h-summary">
            <h2 class="sr-only" id="h-summary" data-i18n="summary">Resumo</h2>
            <div class="card"><span class="label" data-i18n="monthly">Total mensal</span><span class="value" id="total-monthly">—</span></div>
            <div class="card"><span class="label" data-i18n="yearly">Total anual</span><span class="value" id="total-yearly">—</span></div>
            <div class="card"><span class="label" data-i18n="active">Ativas</span><span class="value" id="total-count">—</span></div>
            <div class="card"><span class="label" data-i18n="next">Próxima renovação</span><span class="value small" id="next-renewal">—</span></div>
        </section>

        <div class="rule" data-i18n="upcoming_rule">PRÓXIMOS 30 DIAS</div>
        <ul class="upcoming" id="upcoming"></ul>

        <div class="rule" data-i18n="calendar_rule">CALENDÁRIO</div>
        <section class="calendar" aria-labelledby="cal-title">
            <div class="cal-head">
                <button class="act-btn" type="button" data-action="cal-prev" data-i18n-attr="aria-label:prev_month" aria-label="Mês anterior">←</button>
                <h2 class="cal-title" id="cal-title"></h2>
                <button class="act-btn" type="button" data-action="cal-next" data-i18n-attr="aria-label:next_month" aria-label="Próximo mês">→</button>
            </div>
            <div class="cal-grid" id="calendar-grid" role="list" aria-labelledby="cal-title"></div>
        </section>

        <div class="rule" data-i18n="breakdown_rule">POR CATEGORIA</div>
        <section class="breakdown" id="breakdown" aria-live="polite"></section>

        <div class="rule" id="form-rule" data-i18n="add_rule">NOVA ASSINATURA</div>
        <section class="form-section">
            <form id="sub-form" novalidate>
                <input type="hidden" id="sub-id">
                <div class="field grow"><label for="sub-name" data-i18n="f_name">Nome</label><input type="text" id="sub-name" required maxlength="80" autocomplete="off" placeholder="Netflix"></div>
                <div class="field grow"><label for="sub-domain" data-i18n="f_domain">Site (para o ícone)</label><input type="text" id="sub-domain" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="netflix.com"></div>
                <div class="field"><label for="sub-price" data-i18n="f_price">Valor</label><input type="number" id="sub-price" required min="0" step="0.01" inputmode="decimal"></div>
                <div class="field"><label for="sub-currency" data-i18n="f_currency">Moeda</label><select id="sub-currency"><option value="BRL">BRL (R$)</option><option value="USD">USD ($)</option><option value="EUR">EUR (€)</option></select></div>
                <div class="field"><label for="sub-cycle" data-i18n="f_cycle">Ciclo</label><select id="sub-cycle"><option value="monthly" data-i18n="c_monthly">mensal</option><option value="yearly" data-i18n="c_yearly">anual</option><option value="weekly" data-i18n="c_weekly">semanal</option></select></div>
                <div class="field"><label for="sub-renews" data-i18n="f_renews">Próxima cobrança</label><input type="date" id="sub-renews" required></div>
                <div class="field"><label for="sub-status" data-i18n="f_status">Situação</label><select id="sub-status"><option value="active" data-i18n="s_active">ativa</option><option value="paused" data-i18n="s_paused">pausada</option><option value="cancelled" data-i18n="s_cancelled">cancelada</option></select></div>
                <div class="field grow"><label for="sub-tags" data-i18n="f_tags">Tags (separadas por vírgula)</label><input type="text" id="sub-tags" autocomplete="off" placeholder="streaming, trabalho"></div>
                <div class="field full"><label for="sub-notes" data-i18n="f_notes">Notas</label><input type="text" id="sub-notes" maxlength="500" autocomplete="off"></div>
                <p class="field-error full" id="form-error" role="alert" hidden></p>
                <div class="form-actions full">
                    <button type="button" class="act-btn" id="btn-cancel-edit" data-action="cancel-edit" data-i18n="cancel" hidden>cancelar</button>
                    <button type="submit" class="act-btn ok" id="btn-submit" data-i18n="add">adicionar</button>
                </div>
            </form>
        </section>

        <div class="rule" data-i18n="list_rule">ASSINATURAS</div>
        <section class="list-tools">
            <label class="sr-only" for="q" data-i18n="filter_label">Filtrar</label>
            <input type="search" id="q" class="search" data-i18n-attr="placeholder:filter_ph" placeholder="filtrar por nome, tag, nota…" autocomplete="off">
            <label class="sr-only" for="sort" data-i18n="sort_label">Ordenar</label>
            <select id="sort">
                <option value="next" data-i18n="sort_next">próxima cobrança</option>
                <option value="cost" data-i18n="sort_cost">custo mensal</option>
                <option value="name" data-i18n="sort_name">nome</option>
            </select>
        </section>
        <ul class="subs" id="subs-list"></ul>

        <section class="actions-bar" aria-label="Dados">
            <button class="act-btn" type="button" data-action="export-json" data-i18n="export_json">exportar JSON</button>
            <button class="act-btn" type="button" data-action="import-json" data-i18n="import_json">importar JSON</button>
            <button class="act-btn" type="button" data-action="export-ics" data-i18n="export_ics">exportar calendário (.ics)</button>
            <input type="file" id="import-file" accept="application/json,.json" hidden>
        </section>
    </main>

    <dialog id="dialog" aria-labelledby="dialog-title">
        <h2 id="dialog-title"></h2>
        <div id="dialog-body"></div>
        <div class="dialog-actions" id="dialog-actions"></div>
    </dialog>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
